name: ECtuner Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  
  schedule:
    - cron: "0 2 * * 1" 

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false 
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    defaults:
      run:
        shell: bash -el {0} 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Micromamba and Environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        environment-name: ectuner
        cache-downloads: true 
        cache-environment: true
        create-args: >-
          python=${{ matrix.python-version }}

    - name: Install ECtuner package and test dependencies
      run: pip install -e ".[test]"

    - name: Run Pytest with Coverage
      run: pytest tests/ --cov=ectuner --cov-report=term-missing