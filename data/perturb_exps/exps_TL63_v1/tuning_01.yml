- base.context:
    model_config:
      oifs:
        tuning:
          namcumf:
            RPRCON: 0.0007      # coefficients for determining conversion from cloud water to rain
            ENTRORG: 0.175E-02  # entrainment rate (positive buoyant convection)
            DETRPEN: 0.75E-04   # detrainment rate for penetrative convection
            ENTRDD: 0.3E-03     # entrainment rate for cumulus downdrafts
            RMFDEPS: 0.3        # fractional massflux for downdrafts at lfs
          namcldp:
            RVICE: 0.13         # fixed ice fallspeed
            RLCRITSNOW: 0.3E-04 # critical autoconversion threshold
            RSNOWLIN2: 0.3E-01  # Constant governing of the temperature dependence of the autoconversion
                                # of ice crystals to snow in large-scale precipitation
            RCLDIFF: 0.3E-05    # diffusion-coefficient for evaporation by turbulent mixing
            RCLDIFF_CONVI: 7.0  # enhancement factor of rcldiff for convection
            RDEPLIQREFRATE: 0.5 # (50% deposition efficiency in top layer)
            RDEPLIQREFDEPTH: 500.0 # m (recovery depth scale)
            RCL_OVERLAPLIQICE: 0.65 # overlap assumption for liquid and ice for deposition 
            RCL_INHOMOGAUT: 1.5 # Fixed inhomogeneity factor for autoconversion
            RCL_INHOMOGACC: 3.0 # Fixed inhomogeneity factor for accretion
      nemo:
        tuning:
          namzdf:
            rn_avm0: 0.00001 # coefficient for the vertical eddy viscosity
      rnfm:
        tuning:
          # scaling factors for the freshwater flux to the ocean
          # to control mass balance of the ocean (sea level height)
          # leave empty for no scaling (or set 1.0)
          runoff_scaling: #0.95
          calving_scaling:
