# ==========================================
# ECtuner Master Configuration Template
# ==========================================

files:
  # --- 1D Specific Paths ---
  reference: "/ec/res4/.../gm_reference_EC26-PDAY.yml" 
  sensitivity: "/ec/res4/.../sensitivity_TL63_415_1991-2000.yaml" 
  slope_file: "utils/slopes.yaml" 
  ecmean: "/ec/res4/.../gm_lres/" 
  ecmean_config: "/path/to/config_ecmean.yml"
  base: "GM_EC26-PDAY_{exp}_EC-Earth4_r1i1p1f1_{year1}_{year2}.yml" 

  # --- 2D Specific Paths ---
  ref_2d_dir: "../../ecmean/reference/climatology/EC26-PDAY/r180x90/"
  sensitivity_nc: "../../sensitivities/2D/sensitivity_TL63_415_1991-2000_2D.nc"
  raw_dir: "/ec/res4/scratch/ecme3038/ece4/" 
  base_2d_dir: "/ec/res4/.../ecmean/maps_lres/"
  
  # --- Common Paths ---
  params: "tuning_{exp}.yml"
  exps: "/ec/res4/.../perturb_exps/exps_lres/" 
  output_dir: "/ec/res4/.../results/tuned/"

# ==========================================
# Tuning Arguments
# ==========================================
args:
  year1: 2000
  year2: 2017
  penalty: 0 
  inc: 0.2
  method: 'dual_annealing'
  
  # 1D Specific Args
  model_imbalance: 
  deltaT: 

# ==========================================
# Spatial Tuning Options (Ignored by 1D)
# ==========================================
spatial_tuning:
  target_grid: "r180x90"
  alpha: 0 
  metric: "l2" 
  area_weighting: True
  #r2_treshold: 0.0

# ==========================================
# Parameters Setup
# ==========================================
frozen_parameters:
  RPRCON: default
  #ENTRORG: selected value

reference_parameters: # Default OIFS parameter values (used for penalty)
  RPRCON: 0.14E-02     # coefficients for determining conversion from cloud water to rain
  ENTRORG: 0.175E-02   # entrainment rate (positive buoyant convection)
  DETRPEN: 0.75E-04    # detrainment rate for penetrative convection
  ENTRDD: 0.3E-03      # entrainment rate for cumulus downdrafts
  RMFDEPS: 0.3         # fractional massflux for downdrafts at lfs
  RVICE: 0.13          # fixed ice fallspeed
  RLCRITSNOW: 2E-05  # critical autoconversion threshold
  RSNOWLIN2: 0.3E-01   # Constant governing of the temperature dependence of the autoconversion
                      # of ice crystals to snow in large-scale precipitation
  RCLDIFF: 0.6e-05   #correct value from OpenIFS namelist : 0.6e-05  # diffusion-coefficient for evaporation by turbulent mixing
  RCLDIFF_CONVI: 10.0   # enhancement factor of rcldiff for convection
  RDEPLIQREFRATE: 0.5 # (50% deposition efficiency in top layer)
  RDEPLIQREFDEPTH: 500.0 #m (recovery depth scale)
  RCL_OVERLAPLIQICE: 0.65 #overlap assumption for liquid and ice for deposition
  RCL_INHOMOGAUT: 1.5
  RCL_INHOMOGACC: 3
  RMINICE: 60          # minimum ice crystal radius for sedimentation (microns)

parameter_group: # Parameter grouping for SE output
  namcumf: 
    - RPRCON
    - ENTRORG
    - DETRPEN
    - ENTRDD
    - RMFDEPS
  namcldp:
    - RVICE
    - RLCRITSNOW
    - RSNOWLIN2
    - RCLDIFF
    - RCLDIFF_CONVI
    - RDEPLIQREFRATE
    - RDEPLIQREFDEPTH
    - RCL_OVERLAPLIQICE
    - RCL_INHOMOGAUT
    - RCL_INHOMOGACC
  naerad:
    - RMINICE

# ==========================================
# Weights & Targets
# ==========================================
weights: 
  net_toa: 1.0
  rsnt: 0.0 
  rlnt: 0.0
  swcf: 0.0
  lwcf: 0.0
  net_sfc: 0.0
  toamsfc: 0.0

weights_region:
  Global: 1.0
  Tropical: 0.0      
  North Midlat: 0.0
  South Midlat: 0.0
  Equatorial: 0.0
  North Pole: 0.0
  South Pole: 0.0
  NH: 0.0
  SH: 0.0

weights_season:  # Used only by 1D
  ALL: 1.0
  DJF: 0.0
  JJA: 0.0