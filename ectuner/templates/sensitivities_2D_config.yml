files:
  # OUTPUT: Where the result will be saved
  sensitivity_nc: /path/to/output/sensitivity_TL255_415_{year1}-{year2}_v2_2D.nc
  # INPUT: Templates for finding your ECmean and Tuning files
  params: tuning_{exp}.yml  # Note: 'params' must be just the filename pattern, not a full path.
  # PATHS: Update these to your local machine
  exps: perturb_exps/exps_sres_v2/
  raw_dir: "/ec/res4/scratch/user/ece4/"
  exp_temp: "??" # tag template (es. 00, 01, 02), change to "s???" if your tags are like s001

spatial_tuning:
  # Target grid per il calcolo spaziale (usata da smmregrid)
  target_grid: "r180x90"
  methods_map: 
    net_toa: "ycon"
  target_vars: 
      - net_toa
      - rsnt
      - rlnt
      - swcf
      - lwcf
      - rsns
      - rlns
      - hfss
      - hfls
      - net_sfc
      - toamsfc

args:
  # Default years for sensitivities
  year1: 1991
  year2: 2000
  

reference_parameters: # Default OIFS parameter values (used for penalty)
  RPRCON: 0.0014
  ENTRORG: 0.00175
  DETRPEN: 7.5e-05
  ENTRDD: 0.0003
  RMFDEPS: 0.3
  RVICE: 0.13
  RLCRITSNOW: 2.0e-05 
  RSNOWLIN2: 0.03
  RCLDIFF: 0.3e-05 #correct value from OpenIFS namelist : 0.6e-05 
  RCLDIFF_CONVI: 10.0
  RDEPLIQREFRATE: 0.5 
  RDEPLIQREFDEPTH: 500.0 
  RCL_OVERLAPLIQICE: 0.65
  RCL_INHOMOGAUT: 1.5
  RCL_INHOMOGACC: 3
  RMINICE: 60
