# ECtunerconda environment file
#
#
# Sample usage:
#
# (1) Install environment in a local ".conda" directory
# > conda env create --prefix .conda --file environment.yml
# > conda activate ./.conda
#
# (2) Install environment with name "ectuner"
# > conda env create --name ectuner --file environment.yml
# > conda activate ectuner
#
# (3) Update environment
# > conda activate ectuner
# > conda env update --file environment.yml --prune
# 
name: ectuner
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.10
  - pip
  - cdo
  - ipykernel
  - "esmf=*=nompi_*"
  - xesmf  # for ECmean4 regridding
  - eccodes  # binary eccodes package
  - python-eccodes  # Python API for eccodes
  - scriptengine>=1.2.0
  - numpy
  - scipy
  - pandas
  - xarray
  - matplotlib
  - cartopy
  - tabulate
  - ruamel.yaml
  - pyyaml
  - pip:
    - scriptengine-tasks-ecearth==v0.8.0 # needed only by integrations/ecearth4 (job creation and submission)
    - rdy2cpl @ git+https://github.com/uwefladrich/rdy2cpl.git@main # needed only by integrations/ecearth4 (job creation and submission)
    - scriptengine-tasks-hpc==v1.0.0rc2 # temporary for bug in SE
    - ecmean @ git+https://github.com/oloapinivad/ecmean.git@main # for ECmean4 diagnostics
    - ecbundle @ git+https://github.com/ecmwf/ecbundle.git # needed only by integrations/ecearth4 (job creation and submission)
    - smmregrid
